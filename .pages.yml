media:
  input: public/images
  output: /images

content:
  - name: posts
    label: News Articles
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: category
        label: Category
        type: select
        options:
          - name: Public Safety
            value: public-safety
          - name: Courts & Crime
            value: courts-crime
          - name: City Issues
            value: city-issues
          - name: Deep Dives
            value: deep-dives
        default: courts-crime
      - name: featured
        label: Feature on Homepage
        type: boolean
        default: false
      - name: image
        label: Featured Image
        type: image
      - name: summary
        label: Short Summary
        type: string
      - name: body
        label: Article Body
        type: rich-text
