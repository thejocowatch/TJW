media:
  input: public/images
  output: /images

content:
  - name: posts
    label: News Articles
    type: collection
    path: src/content/posts
    filename: "{year}-{month}-{day}-{primary}.md"
    format: yaml-frontmatter
    fields:
      - name: title
        label: Article Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: category
        label: Category
        type: string
        default: courts-crime
      - name: featured
        label: Feature on Homepage
        type: boolean
        default: false
      - name: feature_until
        label: Feature Expiration Date (Optional)
        type: date
      - name: archive_after
        label: Auto-Archive Date (Removes from categories/home, moves purely to Archive)
        type: date
      - name: image
        label: Featured Image
        type: image
      - name: summary
        label: Short Summary
        type: string
      - name: body
        label: Article Body
        type: rich-text
